# Keep this workflow on the default branch so GitHub can register scheduled runs.
name: Daily Horizon Summary

on:
  schedule:
    # Daily at 23:15 UTC = 07:15 Asia/Shanghai on the next calendar day.
    # GitHub may delay scheduled runs during periods of high load.
    - cron: '15 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The default branch registers the schedule; this validated branch
          # supplies the executable code and deployment configuration.
          ref: deploy/qwen-daily

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # This deployment uses Zhipu GLM only.
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: uv run horizon

      - name: Set current date as environment variable
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Upload candidate audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/audits/*-candidate-audit.json
          if-no-files-found: warn
          retention-days: 30
